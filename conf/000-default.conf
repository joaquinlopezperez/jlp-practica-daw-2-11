<VirtualHost *:80> 

    DocumentRoot /var/www/html 

  

    # setup_https.sh activa esta línea (redirige de HTTP a HTTPS) 

    #Redirect permanent / https://PUT_YOUR_SERVER_NAME_HERE/ 

  

    <Directory /var/www/html> 

        # Permite que funcionen los .htaccess 

        AllowOverride All 

    </Directory> 

  

    ErrorLog ${APACHE_LOG_DIR}/error.log 

    CustomLog ${APACHE_LOG_DIR}/access.log combined 

</VirtualHost> 
